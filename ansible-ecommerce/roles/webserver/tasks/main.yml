---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Deploy Ecommerce application page
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload nginx
  tags:
    - deploy
     
- name: Deploy application secret configuration
  ansible.builtin.copy:
    content: |
      APP_ENVIRONMENT={{ app_environment }}
      APP_SECRET={{ app_secret }}
    dest: /etc/ecommerce-app.conf
    owner: root
    group: root
    mode: '0600'
  no_log: true 

- name: Verify ecommerce application health
  ansible.builtin.uri:
    url: http://localhost
    status_code: 200
    return_content: true
  register: health_check
  failed_when: "'Version: ' ~ app_version not in health_check.content"
