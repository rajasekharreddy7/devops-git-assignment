apiVersion: v1
kind: Pod
metadata:
  name: storage-test-pod
  namespace: ecommerce-dev
spec:
  containers:
    - name: storage-container
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: ecommerce-storage
          mountPath: /data
  volumes:
    - name: ecommerce-storage
      persistentVolumeClaim:
        claimName: ecommerce-storage-pvc
