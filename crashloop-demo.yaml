apiVersion: v1
kind: Pod
metadata:
  name: crashloop-demo
  namespace: troubleshooting-demo
spec:
  restartPolicy: Always
  containers:
    - name: crash-container
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "Application starting successfully..."
          while true; do
            echo "Application is healthy"
            sleep 30
          done
